{% extends 'base.html' %}
{% block title %}个人设置 — mineblog{% endblock %}
{% block content %}

<div class="narrow">
    <p class="label" style="margin-bottom:32px">个人设置</p>

    <div style="margin-bottom:48px;display:flex;align-items:center;gap:24px">
        <!-- 当前头像 -->
        <div style="width:80px;height:80px;border-radius:50%;overflow:hidden;border:1px solid var(--hairline);flex-shrink:0;background:var(--surface)">
            {% if profile.avatar %}
                <img src="{{ profile.avatar }}" alt="" style="width:100%;height:100%;object-fit:cover" id="avatar-preview">
            {% else %}
                <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:28px" id="avatar-placeholder">{{ user.username|first|upper }}</div>
                <img src="" alt="" style="display:none;width:100%;height:100%;object-fit:cover" id="avatar-preview">
            {% endif %}
        </div>

        <div>
            <p style="margin-bottom:8px;font-size:15px">{{ user.username }}</p>
            <button type="button" id="upload-avatar-btn" class="fmt-btn" style="font-size:12px">📷 上传头像</button>
        </div>
    </div>

    <form method="post" id="avatar-form">
        {% csrf_token %}
        <input type="hidden" name="avatar" id="avatar-url" value="{{ profile.avatar }}">
        <button type="submit" class="btn">保存</button>
    </form>

    <hr>
    <a href="{% url 'post_list' %}" class="label">← 返回首页</a>
</div>

<!-- Cloudinary Upload Widget -->
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
<script>
var widget = cloudinary.createUploadWidget({
    cloudName: 'tm0rl5co',
    uploadPreset: 'myblog_upload',
    sources: ['local', 'url'],
    multiple: false,
    clientAllowedFormats: ['png', 'jpg', 'jpeg', 'gif', 'webp'],
    maxFileSize: 5000000,
    cropping: true,
    croppingAspectRatio: 1,
}, function(error, result) {
    if (!error && result && result.event === 'success') {
        var url = result.info.secure_url;
        document.getElementById('avatar-url').value = url;
        var preview = document.getElementById('avatar-preview');
        var placeholder = document.getElementById('avatar-placeholder');
        preview.src = url;
        preview.style.display = 'block';
        if (placeholder) placeholder.style.display = 'none';
    }
});

document.getElementById('upload-avatar-btn').addEventListener('click', function(){ widget.open(); });
</script>
{% endblock %}
