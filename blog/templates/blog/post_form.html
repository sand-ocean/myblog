{% extends 'base.html' %}
{% block title %}{% if form.instance.pk %}编辑{% else %}写文章{% endif %} - mineblog{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto card p-8">
    <h1 class="mb-6">{% if form.instance.pk %}编辑文章{% else %}写文章{% endif %}</h1>

    <form method="post" id="post-form" class="space-y-5" novalidate>
        {% csrf_token %}

        <div>
            <label for="id_title" class="block text-sm meta mb-1">标题</label>
            <input type="text" name="title" id="id_title" value="{{ form.title.value|default:'' }}" required maxlength="200"
                placeholder="给你的文章起个标题"
                class="w-full px-4 py-2.5 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg text-[#e0e0e0] placeholder-[#666] text-sm focus:outline-none focus:ring-1 focus:ring-[#ec4141]/30 focus:border-[#ec4141]/40 transition">
        </div>

        <div>
            <label for="id_slug" class="block text-sm meta mb-1">URL 别名</label>
            <input type="text" name="slug" id="id_slug" value="{{ form.slug.value|default:'' }}" required maxlength="200"
                placeholder="my-post-slug"
                class="w-full px-4 py-2.5 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg text-[#e0e0e0] placeholder-[#666] font-mono text-sm focus:outline-none focus:ring-1 focus:ring-[#ec4141]/30 focus:border-[#ec4141]/40 transition">
        </div>

        <div>
            <label for="id_content" class="block text-sm meta mb-1">正文</label>
            <textarea name="content" id="id_content" required rows="16" placeholder="开始写…"
                class="w-full px-4 py-4 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg text-[#ccc] placeholder-[#666] text-sm leading-relaxed resize-y focus:outline-none focus:ring-1 focus:ring-[#ec4141]/30 focus:border-[#ec4141]/40 transition">{{ form.content.value|default:'' }}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="id_category" class="block text-sm meta mb-1">分类</label>
                <select name="category" id="id_category" class="w-full px-4 py-2.5 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg text-[#ccc] text-sm focus:outline-none focus:ring-1 focus:ring-[#ec4141]/30">
                    {% for choice in form.category.field.queryset %}
                        <option value="{{ choice.id }}" {% if form.category.value|stringformat:"s" == choice.id|stringformat:"s" %}selected{% endif %}>{{ choice.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm meta mb-1">状态</label>
                <div class="flex gap-2">
                    {% for value, label in form.status.field.choices %}
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="status" value="{{ value }}" class="peer sr-only"
                            {% if form.status.value == value %}checked{% elif not form.status.value and value == 'draft' %}checked{% endif %}>
                        <div class="px-4 py-2.5 text-center rounded-lg border-2 border-[#2a2a2a] text-sm meta transition peer-checked:border-[#ec4141]/30 peer-checked:text-[#e0e0e0]">
                            {% if value == 'draft' %}📄 草稿{% else %}🚀 发布{% endif %}
                        </div>
                    </label>
                    {% endfor %}
                </div>
            </div>
        </div>

        <div class="flex gap-3 pt-4 border-t border-[#2a2a2a]">
            <button type="submit" name="action" value="draft" class="px-5 py-2.5 border border-[#2a2a2a] rounded-lg text-sm meta hover:text-white hover:bg-[#252525] transition">存草稿</button>
            <button type="submit" name="action" value="publish" class="px-6 py-2.5 text-white rounded-lg text-sm font-medium transition" style="background:var(--accent)">发布</button>
            <a href="{% url 'post_list' %}" class="px-5 py-2.5 border border-[#2a2a2a] rounded-lg text-sm meta ml-auto hover:text-white transition">取消</a>
        </div>
    </form>
</div>

{% endblock %}
