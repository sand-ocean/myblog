{% extends 'base.html' %}
{% block title %}{% if form.instance.pk %}编辑文章{% else %}写文章{% endif %}{% endblock %}
{% block content %}

<div class="bg-gray-900 border border-gray-800 rounded-lg p-8 max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-100 mb-6">
        {% if form.instance.pk %}编辑文章{% else %}写文章{% endif %}
    </h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-4 [&_label]:text-gray-400 [&_label]:block [&_label]:mb-1 [&_input]:w-full [&_input]:px-3 [&_input]:py-2 [&_input]:bg-gray-800 [&_input]:border [&_input]:border-gray-700 [&_input]:rounded-lg [&_input]:text-gray-200 [&_input]:focus:outline-none [&_input]:focus:ring-2 [&_input]:focus:ring-cyan-500 [&_select]:w-full [&_select]:px-3 [&_select]:py-2 [&_select]:bg-gray-800 [&_select]:border [&_select]:border-gray-700 [&_select]:rounded-lg [&_select]:text-gray-200 [&_select]:focus:outline-none [&_select]:focus:ring-2 [&_select]:focus:ring-cyan-500 [&_textarea]:w-full [&_textarea]:px-3 [&_textarea]:py-2 [&_textarea]:bg-gray-800 [&_textarea]:border [&_textarea]:border-gray-700 [&_textarea]:rounded-lg [&_textarea]:text-gray-200 [&_textarea]:focus:outline-none [&_textarea]:focus:ring-2 [&_textarea]:focus:ring-cyan-500">
            {{ form.as_p }}
        </div>
        <div class="flex gap-3 pt-6 border-t border-gray-800">
            <button type="submit"
                    class="px-6 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-500 transition">保存</button>
            <a href="{% url 'post_list' %}"
               class="px-6 py-2 border border-gray-700 text-gray-400 rounded-lg hover:bg-gray-800 hover:text-gray-200 transition">取消</a>
        </div>
    </form>
</div>

{% endblock %}
