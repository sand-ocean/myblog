{% extends 'base.html' %}
{% block title %}注册{% endblock %}
{% block content %}

<div class="max-w-sm mx-auto bg-violet-950/50 border border-violet-900/50 rounded-lg p-8 mt-12">
    <h1 class="text-2xl font-bold text-violet-100 mb-6 text-center">注册</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-4 [&_label]:text-violet-400 [&_label]:block [&_label]:mb-1 [&_input]:w-full [&_input]:px-3 [&_input]:py-2 [&_input]:bg-violet-950 [&_input]:border [&_input]:border-violet-800 [&_input]:rounded-lg [&_input]:text-violet-200 [&_input]:focus:outline-none [&_input]:focus:ring-2 [&_input]:focus:ring-pink-500">
            {{ form.as_p }}
        </div>
        <button type="submit"
                class="w-full mt-4 px-6 py-2 bg-pink-600 text-white rounded-lg hover:bg-pink-500 transition font-medium">注册</button>
    </form>
    <p class="text-center text-sm text-violet-500 mt-4">
        已有账号？<a href="{% url 'login' %}" class="text-pink-400 hover:text-pink-300">去登录</a>
    </p>
</div>

{% endblock %}
