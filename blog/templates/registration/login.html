{% extends 'base.html' %}
{% block title %}登录 - mineblog{% endblock %}
{% block content %}

<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <span class="w-14 h-14 bg-red/15 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7 text-red" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="5" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </span>
      <h1 class="text-2xl font-bold text-white mb-2">登录 mineblog</h1>
      <p class="text-[#999] text-sm">还没有账号？<a href="{% url 'register' %}" class="text-red hover:text-[#f05a5a] transition">立即注册</a></p>
    </div>

    <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl p-6">
      {% if form.errors %}
      <div class="mb-5 p-4 bg-red/5 border border-red/20 rounded-lg text-xs" role="alert">
        <p class="text-red font-medium mb-1">登录失败</p>
        <p class="text-[#c88]">用户名或密码不正确，请重试。</p>
      </div>
      {% endif %}

      <form method="post" class="space-y-4" novalidate>
        {% csrf_token %}
        <div>
          <label for="id_username" class="block text-xs text-[#aaa] mb-1.5">用户名</label>
          <input type="text" name="username" id="id_username" autocomplete="username" required autofocus
                 placeholder="输入用户名"
                 class="w-full px-4 py-2.5 bg-[#252525] border {% if form.username.errors %}border-red/40{% else %}border-[#333]{% endif %} rounded-lg text-[#e0e0e0] placeholder-[#666] text-sm focus:outline-none focus:ring-1 focus:ring-red/30 focus:border-red/40 transition">
        </div>
        <div>
          <label for="id_password" class="block text-xs text-[#aaa] mb-1.5">密码</label>
          <input type="password" name="password" id="id_password" autocomplete="current-password" required
                 placeholder="输入密码"
                 class="w-full px-4 py-2.5 bg-[#252525] border {% if form.password.errors %}border-red/40{% else %}border-[#333]{% endif %} rounded-lg text-[#e0e0e0] placeholder-[#666] text-sm focus:outline-none focus:ring-1 focus:ring-red/30 focus:border-red/40 transition">
        </div>
        <button type="submit"
                class="w-full py-2.5 bg-red hover:bg-[#f05a5a] text-white rounded-full font-medium text-sm transition">
          登录
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
