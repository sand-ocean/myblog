{% extends 'base.html' %}
{% block title %}登录 — mineblog{% endblock %}
{% block content %}

<div class="narrow" style="padding-top:64px">
    <p class="label" style="margin-bottom:48px">登录</p>

    {% if form.errors %}
    <p style="color:var(--accent);font-size:12px;margin-bottom:32px">用户名或密码不正确</p>
    {% endif %}

    <form method="post" style="max-width:360px" novalidate>
        {% csrf_token %}
        <div style="margin-bottom:24px">
            <input type="text" name="username" id="id_username" required autofocus
                   placeholder="用户名" autocomplete="username">
        </div>
        <div style="margin-bottom:32px">
            <input type="password" name="password" id="id_password" required
                   placeholder="密码" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">登录</button>
    </form>

    <p style="color:var(--soft);font-size:13px;margin-top:32px">
        还没有账号？<a href="{% url 'register' %}">注册</a>
    </p>
</div>
{% endblock %}
