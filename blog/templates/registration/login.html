{% extends 'base.html' %}
{% block title %}登录{% endblock %}
{% block content %}

<div class="max-w-sm mx-auto bg-gray-900 border border-gray-800 rounded-lg p-8 mt-12">
    <h1 class="text-2xl font-bold text-gray-100 mb-6 text-center">登录</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-4 [&_label]:text-gray-400 [&_label]:block [&_label]:mb-1 [&_input]:w-full [&_input]:px-3 [&_input]:py-2 [&_input]:bg-gray-800 [&_input]:border [&_input]:border-gray-700 [&_input]:rounded-lg [&_input]:text-gray-200 [&_input]:focus:outline-none [&_input]:focus:ring-2 [&_input]:focus:ring-cyan-500">
            {{ form.as_p }}
        </div>
        <button type="submit"
                class="w-full mt-4 px-6 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-500 transition font-medium">登录</button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-4">
        还没有账号？<a href="{% url 'register' %}" class="text-cyan-400 hover:text-cyan-300">去注册</a>
    </p>
</div>

{% endblock %}
