{% extends 'base.html' %}
{% block title %}登录{% endblock %}
{% block content %}

<div class="max-w-sm mx-auto bg-white border border-gray-200 rounded-lg p-8 mt-12">
    <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">登录</h1>
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
        </div>
        <button type="submit"
                class="w-full mt-4 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">登录</button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-4">
        还没有账号？<a href="{% url 'register' %}" class="text-blue-600 hover:text-blue-800">去注册</a>
    </p>
</div>

{% endblock %}
