<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}mineblog{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{ink:'#2A2A28',soft:'#7C7B76',hairline:'#E3E0D8',ground:'#F8F6F0',accent:'#C8161D'}}}}</script>
    <style>
        :root {
            --ground: #F8F6F0; --ink: #2A2A28; --soft: #7C7B76;
            --hairline: #E3E0D8; --accent: #C8161D; --surface: #F2F0EA;
        }
        [data-theme="dark"] {
            --ground: #1A1A17; --ink: #E6E4D8; --soft: #9A9890;
            --hairline: #33332E; --accent: #C8161D; --surface: #22221E;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --ground: #1A1A17; --ink: #E6E4D8; --soft: #9A9890;
                --hairline: #33332E; --accent: #C8161D; --surface: #22221E;
            }
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
            background: var(--ground); color: var(--ink);
            -webkit-font-smoothing: antialiased;
            line-height: 1.8; letter-spacing: 0.01em;
        }
        ::selection { background: rgba(200,22,29,0.12); }
        a { color: var(--soft); text-decoration: none; transition: color .6s; }
        a:hover { color: var(--accent); }
        hr { border: none; border-top: 1px solid var(--hairline); margin: 48px 0; }
        h1 { font-size: clamp(22px, 3vw, 28px); font-weight: 400; letter-spacing: 0.02em; line-height: 1.4; margin-bottom: 48px; }
        h2 { font-size: 18px; font-weight: 400; letter-spacing: 0.02em; margin-bottom: 24px; }
        .label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); }
        .narrow { max-width: 640px; }
        input[type="text"], input[type="password"], input[type="search"],
        textarea, select {
            width: 100%; padding: 12px 0; background: transparent;
            border: none; border-bottom: 1px solid var(--hairline);
            font-family: inherit; font-size: 15px; color: var(--ink);
            outline: none; border-radius: 0; transition: border-color .6s;
            line-height: 1.6; letter-spacing: 0.01em;
        }
        input:focus, textarea:focus, select:focus { border-bottom-color: var(--ink); }
        input::placeholder, textarea::placeholder { color: #C4C0B6; }
        [data-theme="dark"] input::placeholder,
        [data-theme="dark"] textarea::placeholder { color: #5A5852; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) input::placeholder,
            :root:not([data-theme="light"]) textarea::placeholder { color: #5A5852; }
        }
        button { cursor: pointer; font-family: inherit; }
        .btn {
            display: inline-block; padding: 10px 32px; font-size: 13px;
            letter-spacing: 0.04em; border: 1px solid var(--hairline);
            background: transparent; color: var(--ink); transition: all .6s;
        }
        .btn:hover { background: var(--ink); color: var(--ground); border-color: var(--ink); }
        .btn-primary { border-color: var(--ink); background: var(--ink); color: var(--ground); }
        .btn-primary:hover { background: transparent; color: var(--ink); }
        select option { background: var(--ground); color: var(--ink); }
        .fade { animation: fadeIn .6s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        footer { font-size: 11px; color: var(--soft); letter-spacing: 0.05em; padding: 96px 0 48px; }
        @media (max-width: 640px) { body { font-size: 14px; } }
    </style>
</head>
<body class="min-h-screen">

    <!-- 导航 — 极简，仅 logo + 功能链接 -->
    <header style="padding:48px 0">
        <div class="max-w-4xl mx-auto px-6 flex items-end justify-between">
            <a href="{% url 'post_list' %}" class="text-[var(--ink)] hover:text-[var(--accent)]" style="font-size:16px;font-weight:400;letter-spacing:0.06em;text-decoration:none">mineblog</a>
            <nav class="flex items-center gap-6 text-xs" style="letter-spacing:0.05em">
                {% if user.is_authenticated %}
                    <a href="{% url 'post_new' %}">写文章</a>
                    <span class="text-[var(--soft)]" style="font-size:10px">·</span>
                    <a href="{% url 'drafts' %}">草稿箱</a>
                    <span class="text-[var(--soft)]" style="font-size:10px">·</span>
                    <a href="{% url 'profile' %}">
                        {% if user.profile.avatar %}
                            <img src="{{ user.profile.avatar }}" alt="" style="width:18px;height:18px;border-radius:50%;object-fit:cover;vertical-align:middle">
                        {% endif %}
                    </a>
                    <a href="{% url 'profile' %}" class="text-[var(--soft)] hover:text-[var(--ink)]">{{ user.username }}</a>
                    <form method="post" action="{% url 'logout' %}" style="display:inline">
                        {% csrf_token %}
                        <button type="submit" style="background:none;border:none;color:var(--soft);font-size:inherit;letter-spacing:0.04em;cursor:pointer;padding:0">退出</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">登录</a>
                    <a href="{% url 'register' %}">注册</a>
                {% endif %}
                <span class="text-[var(--soft)]" style="font-size:10px">·</span>
                <button id="theme-toggle" style="background:none;border:none;color:var(--soft);font-size:11px;letter-spacing:0.05em;cursor:pointer" aria-label="切换明暗主题">明</button>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 fade">
        {% block content %}{% endblock %}
    </main>

    <footer class="max-w-4xl mx-auto px-6">
        <p>&copy; mineblog</p>
    </footer>

    <script>
    (function(){
        const html = document.documentElement;
        const toggle = document.getElementById('theme-toggle');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

        function getTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) return saved;
            return prefersDark.matches ? 'dark' : 'light';
        }

        function apply(t) {
            html.setAttribute('data-theme', t);
            toggle.textContent = t === 'dark' ? '暗' : '明';
        }

        apply(getTheme());

        toggle.addEventListener('click', function(){
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', next);
            apply(next);
        });
    })();
    </script>

</body>
</html>
