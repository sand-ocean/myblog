<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}mineblog{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{red:{DEFAULT:'#ec4141',hover:'#f05a5a'},card:{DEFAULT:'#1a1a1a',raised:'#252525'},bg:{DEFAULT:'#121212',raised:'#1a1a1a'},border:{DEFAULT:'#2a2a2a',light:'#333'},text:{primary:'#e0e0e0',secondary:'#999',muted:'#666'}}}}}</script>
    <style>
        :root {
            --bg: #121212; --surface: #1A1A1A; --surface-raised: #252525;
            --border: #2A2A2A; --border-visible: #333;
            --text-primary: #E0E0E0; --text-secondary: #999; --text-muted: #666;
            --accent: #EC4141; --accent-hover: #F05A5A;
        }
        body { font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background: var(--bg); color: var(--text-primary); }
        ::selection { background: rgba(236,65,65,0.3); color: #fff; }
        .glass { background: rgba(26,26,26,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
        .card:hover { background: var(--surface-raised); border-color: var(--border-visible); }
        a { color: var(--text-secondary); transition: color .15s; }
        a:hover { color: var(--text-primary); }
        .link-red { color: var(--accent); }
        .link-red:hover { color: var(--accent-hover); }
        h1 { font-size: 28px; font-weight: 600; }
        h2 { font-size: 20px; font-weight: 500; }
        body { font-size: 16px; line-height: 1.75; }
        .meta { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body class="min-h-screen antialiased">
    <!-- 毛玻璃导航 -->
    <header class="glass sticky top-0 z-50 border-b border-[#2a2a2a]">
        <div class="max-w-4xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="{% url 'post_list' %}" class="font-semibold tracking-wide" style="color:var(--accent);font-size:18px">🎵 mineblog</a>
            <nav class="flex items-center gap-3 text-sm">
                {% if user.is_authenticated %}
                    <a href="{% url 'post_new' %}" class="link-red px-3 py-1.5 rounded-md" style="background:rgba(236,65,65,0.08)">写文章</a>
                    <span class="meta">{{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="meta hover:text-white">退出</a>
                {% else %}
                    <a href="{% url 'login' %}" class="link-red">登录</a>
                    <a href="{% url 'register' %}" class="meta hover:text-white">注册</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-12">
        {% block content %}{% endblock %}
    </main>

    <!-- 播放栏式页脚 -->
    <footer class="fixed bottom-0 left-0 right-0 border-t border-[#2a2a2a] z-40" style="background:var(--surface)">
        <div class="max-w-4xl mx-auto px-6 h-12 flex items-center justify-between meta">
            <span>© mineblog</span>
            <span>Django · NetEase Design</span>
        </div>
    </footer>
    <div class="h-12"></div>
</body>
</html>
