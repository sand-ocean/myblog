<!DOCTYPE html>
<html lang="zh" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}我的博客{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-indigo-950 text-violet-200 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-indigo-950/80 backdrop-blur border-b border-violet-900/50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="{% url 'post_list' %}" class="text-xl font-bold text-violet-100 hover:text-pink-400 transition">📝 我的博客</a>
            <div class="flex gap-4 text-sm">
                {% if user.is_authenticated %}
                    <span class="text-violet-400">👋 {{ user.username }}</span>
                    <a href="{% url 'post_new' %}" class="text-pink-400 hover:text-pink-300 font-medium">＋ 写文章</a>
                    <a href="{% url 'logout' %}" class="text-violet-500 hover:text-violet-300 transition">退出</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-pink-400 hover:text-pink-300">登录</a>
                    <a href="{% url 'register' %}" class="text-violet-500 hover:text-violet-300 transition">注册</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="border-t border-violet-900/50 mt-12 py-6 text-center text-sm text-violet-700">
        Powered by Django — 我的第一个博客
    </footer>
</body>
</html>
