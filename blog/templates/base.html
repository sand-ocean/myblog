<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}我的博客{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="{% url 'post_list' %}" class="text-xl font-bold text-gray-800 hover:text-blue-600">📝 我的博客</a>
            <div class="flex gap-4 text-sm">
                {% if user.is_authenticated %}
                    <span class="text-gray-600">👋 {{ user.username }}</span>
                    <a href="{% url 'post_new' %}" class="text-blue-600 hover:text-blue-800 font-medium">＋ 写文章</a>
                    <a href="{% url 'logout' %}" class="text-gray-500 hover:text-gray-700">退出</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-800">登录</a>
                    <a href="{% url 'register' %}" class="text-gray-500 hover:text-gray-700">注册</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="border-t border-gray-200 mt-12 py-6 text-center text-sm text-gray-400">
        Powered by Django — 我的第一个博客
    </footer>
</body>
</html>
